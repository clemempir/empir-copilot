project_id = "empir-copilot"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
# Page « compte confirmé » (fonction edge publique `confirmed`) : cible de
# redirection du lien de confirmation d'e-mail.
site_url = "https://coqvobufxwurgrsphhnq.supabase.co/functions/v1/confirmed"
additional_redirect_urls = [
  "chrome-extension://*",
  "moz-extension://*",
  "https://coqvobufxwurgrsphhnq.supabase.co/functions/v1/confirmed",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Confirmation d'e-mail OBLIGATOIRE : un compte ne débloque l'illimité
# qu'après vérification (lien cliqué OU code à 6 chiffres saisi dans
# l'extension). À activer aussi en prod : dashboard → Auth → Providers →
# Email → Confirm email.
enable_confirmations = true

# Template de l'e-mail de confirmation (design EMPIR) : bouton
# {{ .ConfirmationURL }} + code {{ .Token }} en secours. En prod, poussé via
# l'API de management (cf. scripts/push-email-template.mjs).
[auth.email.template.confirmation]
subject = "Confirmez votre compte EMPIR Copilot"
content_path = "./supabase/templates/confirmation.html"

# Page d'atterrissage publique du lien de confirmation (pas de JWT).
[functions.confirmed]
verify_jwt = false

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret  = "env(GOOGLE_OAUTH_CLIENT_SECRET)"
redirect_uri = ""

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
