project_id = "empir-copilot"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["chrome-extension://*", "moz-extension://*"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Confirmation d'e-mail OBLIGATOIRE : un compte ne débloque l'illimité
# qu'après vérification (code à 6 chiffres saisi dans l'extension). À activer
# aussi en prod : dashboard → Auth → Providers → Email → Confirm email.
enable_confirmations = true

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret  = "env(GOOGLE_OAUTH_CLIENT_SECRET)"
redirect_uri = ""

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
